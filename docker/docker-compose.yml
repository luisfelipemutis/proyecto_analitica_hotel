# ============================================================
# HOTEL DANN MONASTERIO — PIPELINE ETL KIMBALL
# Airflow + Postgres (metadatos Airflow)
# MySQL corre en el host local — NO como servicio Docker
# ============================================================

name: proyecto_analitica_hotel

services:

  # =========================================================
  # POSTGRES — Solo para metadatos internos de Airflow
  # (NO es la base de datos del hotel)
  # =========================================================
  postgres:
    image: postgres:15
    container_name: hotel_airflow_postgres
    restart: always
    environment:
      POSTGRES_USER:     airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB:       airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - analitica_network

  # =========================================================
  # AIRFLOW INIT — Inicializa DB y crea usuario admin
  # =========================================================
  airflow-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hotel_airflow_init
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR:             LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES:        "false"
      PYTHONPATH:                          /opt/airflow/project
    # IMPORTANTE: el comando va en formato lista para evitar que Docker Compose
    # interprete las líneas del argumento bash -c como comandos separados.
    # Las variables $$VAR usan $$ para que Docker Compose NO las expanda —
    # bash las lee directamente del entorno del contenedor (env_file).
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        airflow users create
        --username $$AIRFLOW_USER
        --password $$AIRFLOW_PASSWORD
        --firstname Admin
        --lastname Hotel
        --role Admin
        --email admin@hoteldann.com
    volumes:
      - ../dags:/opt/airflow/dags
      - ..:/opt/airflow/project
    networks:
      - analitica_network

  # =========================================================
  # AIRFLOW WEBSERVER — Interfaz gráfica en localhost:8091
  # =========================================================
  airflow-webserver:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hotel_airflow_webserver
    restart: always
    depends_on:
      - airflow-init
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR:             LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES:        "false"
      PYTHONPATH:                          /opt/airflow/project
    command: webserver
    ports:
      - "${AIRFLOW_PORT}:8080"
    volumes:
      - ../dags:/opt/airflow/dags
      - ..:/opt/airflow/project
      - airflow_logs:/opt/airflow/logs
    networks:
      - analitica_network

  # =========================================================
  # AIRFLOW SCHEDULER — Ejecuta los DAGs
  # =========================================================
  airflow-scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hotel_airflow_scheduler
    restart: always
    depends_on:
      - airflow-init
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR:             LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES:        "false"
      PYTHONPATH:                          /opt/airflow/project
    command: scheduler
    volumes:
      - ../dags:/opt/airflow/dags
      - ..:/opt/airflow/project
      - airflow_logs:/opt/airflow/logs
    networks:
      - analitica_network

# =========================================================
# NETWORKS
# =========================================================
networks:
  analitica_network:

# =========================================================
# VOLUMES
# =========================================================
volumes:
  postgres_data:
  airflow_logs:
